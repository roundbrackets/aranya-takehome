apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-aranya
  namespace: hello-aranya
  labels:
    app: hello-aranya
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-aranya
  template:
    metadata:
      labels:
        app: hello-aranya
    spec:
      # Spread the 3 replicas across the 3 nodes; still schedule if a node is down
      # (ScheduleAnyway keeps the service available during the node-failure test).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-aranya
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: hello-aranya-html
