# Kubespray inventory — Linode rehearsal environment.
# Fill in real IPs after provisioning the three Linode VMs + private VLAN.
# ansible_host = public IP (SSH in); ip/access_ip = private VLAN IP (cluster traffic).
all:
  hosts:
    node1:
      ansible_host: <PUBLIC_IP_1>
      ip: 10.20.0.11
      access_ip: 10.20.0.11
    node2:
      ansible_host: <PUBLIC_IP_2>
      ip: 10.20.0.12
      access_ip: 10.20.0.12
    node3:
      ansible_host: <PUBLIC_IP_3>
      ip: 10.20.0.13
      access_ip: 10.20.0.13
  children:
    kube_control_plane:
      hosts:
        node1:
        node2:
        node3:
    kube_node:
      hosts:
        node1:
        node2:
        node3:
    etcd:
      hosts:
        node1:
        node2:
        node3:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
